<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhandaFin: Invoice Generator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="no-print">
        <h1 id="business-name">Business Name</h1>
        <p>Invoice Generator</p>
    </header>

    <main> 
        <!-- Form section -->
        <section class="card no-print">
            <h2>Create Invoice</h2> 
            <label for="customer-name">Customer name</label> 
            <input type="text" id="customer-name" placeholder="e.g. Thandi Mokoena"> 
            <label for="product-select">Product</label> 
            <select id="product-select"></select> 
            <label for="quantity">Quantity</label> 
            <input type="number" id="quantity" value="1" min="1"> 
            <button id="add-item-btn" type="button">Add Item</button>
            <div class="checkbox-row"> 
                <input type="checkbox" id="delivery-checkbox">
                <label for="delivery-checkbox">Add delivery fee</label> 
            </div>
                <p id="message" class="message"></p>
        </section> 
                
        <!-- Invoice section -->
        <section id="invoice" class="card">
            <div class="invoice-header">
                <div>
                    <h2 id="invoice-business-name"></h2>
                    <p id="invoice-business-address"></p>
                    <p id="invoice-business-phone"></p>
                </div>
                <div class="invoice-meta">
                    <p><strong>Invoice #:</strong> 
                        <span id="invoice-number"></span>
                    </p>
                    <p><strong>Date:</strong> 
                        <span id="invoice-date"></span>
                    </p>
                </div>
            </div>
            <p><strong>Bill to:</strong> 
                <span id="invoice-customer">—</span>
            </p>
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Qty</th>
                        <th>Unit Price</th>
                        <th>Line Total</th>
                        <th class="no-print">Action</th>
                    </tr>
                </thead>
                <tbody id="items-body"></tbody>
            </table>

            <div class="totals">
                <p>Subtotal: <span id="subtotal"></span></p>
                <p>Delivery: <span id="delivery"></span></p>
                <p>VAT (<span id="vat-percent"></span>%): <span id="vat-amount"></span></p>
                <p class="grand-total">Total: <span id="grand-total"></span></p>
            </div>
        </section>

        <!-- Action buttons -->
            <div class="actions no-print"> 
                <button id="print-btn" type="button">Print / Save as PDF</button>
                <button id="new-invoice-btn" type="button">New Invoice</button> 
            </div> 
    </main> 
    
    <script src="js/app.js"></script>
</body>
</html>
